[project]
name = "encore"
version = "1.0.0"
description = "A taste agent for care-home activity coordinators, built on Qloo."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["fastapi==0.143.2", "uvicorn[standard]==0.54.0", "pydantic==2.14.1", "httpx==0.28.1", "mcp==2.3.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.14.0"]
capture = ["playwright==1.64.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["encore*"]
