[project]
name = "encore"
version = "1.0.0"
description = "A taste agent for care-home activity coordinators, built on Qloo."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic>=2.9", "httpx>=0.27", "mcp>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "playwright>=1.48"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["encore*"]
